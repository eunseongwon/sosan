spring.application.name=sosang-workspace
server.port=8080

# ── 로컬 설정 파일 (application-local.properties) 우선 적용 (gitignore 처리됨)
spring.config.import=optional:classpath:application-local.properties

# ── MySQL (실제 값은 application-local.properties에서 오버라이드)
spring.datasource.url=jdbc:mysql://localhost:3306/sosangdb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# ── JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── CORS 허용 출처 (운영 시 환경변수 ALLOWED_ORIGINS 에 실제 도메인 설정)
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── API 키 (application-local.properties 또는 환경변수에서 설정)
openai.api.key=${OPENAI_API_KEY}
molit.api.key=${MOLIT_API_KEY}
sbiz.api.key=${SBIZ_API_KEY}
rone.api.key=${RONE_API_KEY}
smes.api.key=${SMES_API_KEY}
nts.api.key=${NTS_API_KEY}
kamis.api.key=${KAMIS_API_KEY}
